services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5438}:5432'
    environment:
      POSTGRES_USER: minicrm
      POSTGRES_PASSWORD: minicrm
      POSTGRES_DB: minicrm
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U minicrm -d minicrm']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
