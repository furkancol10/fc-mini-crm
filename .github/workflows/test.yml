name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: minicrm
          POSTGRES_PASSWORD: minicrm
          POSTGRES_DB: minicrm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minicrm -d minicrm_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://minicrm:minicrm@localhost:5432/minicrm_test
      TEST_DATABASE_URL: postgres://minicrm:minicrm@localhost:5432/minicrm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Integration testleri şemayı kendi içinde migrate eder (tests/integration/helpers.ts).
      - run: npm test
